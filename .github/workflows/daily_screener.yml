name: TSX Daily Stock Screener

permissions:
  contents: write

on:
  schedule:
    # 10:32 AM EDT (Mon-Fri) -> 14:32 UTC (Backup fallback)
    - cron: '32 14 * * 1-5'
    # 4:47 PM EDT (Mon-Fri) -> 20:47 UTC (Backup fallback)
    - cron: '47 20 * * 1-5'
  workflow_dispatch:

jobs:
  screen-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Screener
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python ScreenStocksV1.py

      - name: Commit and Push Results to Data Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B data
          git add -f screener_results.csv
          if git diff --staged --quiet; then
            echo "No CSV changes detected."
          else
            git commit -m "data(auto): daily scan results [skip ci]"
            git push -f origin data
          fi