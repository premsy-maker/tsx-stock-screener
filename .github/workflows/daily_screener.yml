name: TSX Daily Stock Screener

permissions:
  contents: write

on:
  schedule:
    # 10:32 AM EDT (Mon-Fri) -> 14:32 UTC
    - cron: '32 14 * * 1-5'
    # 4:47 PM EDT (Mon-Fri) -> 20:47 UTC (45 mins after market close)
    - cron: '47 20 * * 1-5'
  workflow_dispatch:

jobs:
  screen-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Screener
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python ScreenStocksV1.py

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add screener_results.csv
          if git diff --staged --quiet; then
            echo "No CSV changes detected."
          else
            git commit -m "data(auto): daily scan results [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi